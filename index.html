const yr=$('yr'),mo=$('mo'),unit=$('unit'),rank=$('rank'),nm=$('nm'),sic=$('sic'),add=$('add'),gen=$('gen'),clear=$('clear'),csv=$('csv'),pdf=$('pdf'),shareImage=$('shareImage'),shareModal=$('shareModal'),sharePreview=$('sharePreview'),shareBtn=$('shareBtn'),downloadImg=$('downloadImg'),closeShare=$('closeShare'),tab=$('tab'),notes=$('notes'),people=$('people'),hist=$('hist'),install=$('install');let now=new Date();yr.value=now.getFullYear();M.forEach((x,i)=>mo.add(new Option(x,i)));mo.value=now.getMonth();const date=(y,m)=>Array.from({length:new Date(y,m+1,0).getDate()},(_,i)=>new Date(y,m,i+1)),key=d=>d.toISOString().slice(0,10), esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function duty(id,k){return db.a[k]?.pid===id}function generate(){

">• ${esc(n.text)}</div>`).join('')||'<span class="muted">Kayıt yok.</span>'}function renderPeople(){people.innerHTML=db.people.map((p,i)=>`<div class="item"><div><b>${i+1}. ${esc(p.unit||'')} — ${esc(p.rank)} ${esc(p.name)}</b><br><span class="muted">Sicil: ${esc(p.sic)}</span></div><button class="danger" onclick="del('${p.id}')">Sil</button></div>`).join('')||'<span class="muted">Personel yok.</span>'}function del(id){if(confirm('Personel silinsin mi?')){db.people=db.people.filter(p=>p.id!==id);save()}}function addPerson(){if(!nm.value.trim())return alert('İsim soyisim girin.');db.people.push({id:crypto.randomUUID(),unit:unit.value.trim(),rank:rank.value.trim(),name:nm.value.trim(),sic:sic.value.trim()});unit.value=rank.value=nm.value=sic.value='';save()}function render(){renderRoster();renderPeople();hist.innerHTML=[...new Set(Object.keys(db.a).sort().reverse().map(x=>x.slice(0,7)))].map(x=>`<div class="item"><b>${x}</b><span class="muted">Kayıtlı ay</span></div>`).join('')||'<span class="muted">Geçmiş yok.</span>'}add.onclick=addPerson;gen.onclick=generate;clear.onclick=()=>{if(confirm('Bu ayın tüm nöbetleri silinsin mi?')){Object.keys(db.a).filter(k=>k.startsWith(`${yr.value}-${String(+mo.value+1).padStart(2,'0')}`)).forEach(k=>delete db.a[k]);save()}};csv.onclick=()=>{
 let ds=date(+yr.value,+mo.value), head=['Sıra','Birliği','Rütbe','İsim Soyisim','Sicil',...ds.map(d=>`${d.getDate()} ${D[d.getDay()]}`)];

 let html=`<!doctype html><html><head><meta charset='utf-8'><style>@page{size:A4 landscape;margin:8mm}body{font-family:Arial,sans-serif;font-size:9pt}h1{text-align:center;font-size:16pt;margin:0 0 4px}h2{text-align:center;font-size:11pt;margin:0 0 10px}table{border-collapse:collapse;width:100%;table-layout:fixed}th,td{border:2px solid #111;padding:5px 3px;text-align:center;vertical-align:middle;height:24px}th{background:#e9edf2;font-weight:700}th:nth-child(1),td:nth-child(1){width:4%}th:nth-child(2),td:nth-child(2){width:14%}th:nth-child(3),td:nth-child(3){width:9%}th:nth-child(4),td:nth-child(4){width:17%;text-align:left}th:nth-child(5),td:nth-child(5){width:9%}.duty{font-weight:700;font-size:12pt;background:#dce8f5}.weekend{background:#f5eddc}.notes{margin-top:10px;font-size:8pt}.notes b{font-size:9pt}</style></head><body><h1>NÖBET YÖNETİM SİSTEMİ</h1><h2>${M[+mo.value]} ${yr.value}</h2><table><tr>${head.map(x=>`<th>${esc(x)}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map((x,i)=>`<td class='${x==='N'?'duty':''}'>${esc(String(x))}</td>`).join('')}</tr>`).join('')}</table><div class='notes'><b>Değişiklik Dipnotları</b><br>${notesText||'Yok.'}</div></body></html>`;

function makeShareImage(){

 ds.forEach(d=>{ctx.fillStyle=[0,6].includes(d.getDay())?'#f7f0df':'#eef2f6';ctx.fillRect(x,54,cellW,34);ctx.strokeStyle='#1f2937';ctx.lineWidth=2;ctx.strokeRect(x,54,cellW,34);ctx.fillStyle='#17202a';ctx.font='bold 11px Arial';ctx.textAlign='center';ctx.fillText(`${d.getDate()} ${D[d.getDay()]}`,x+cellW/2,77);x+=cellW});ctx.textAlign='left';
 ps.forEach((p,ri)=>{let yy=topH+ri*rowH,x=0;let vals=[String(ri+1),p.unit||'',p.rank||'',p.name||'',p.sic||'']; vals.forEach((v,i)=>{ctx.fillStyle='#fff';ctx.fillRect(x,yy,left[i],rowH);ctx.strokeStyle='#1f2937';ctx.lineWidth=1.5;ctx.strokeRect(x,yy,left[i],rowH);ctx.fillStyle='#17202a';ctx.font=i===3?'bold 12px Arial':'11px Arial';ctx.fillText(v,x+6,yy+30);x+=left[i]});
 ds.forEach(d=>{let k=key(d),a=db.a[k],isDuty=a&&a.pid===p.id,isEx=db.exc.some(e=>e.pid===p.id&&e.date===k);ctx.fillStyle=isEx?'#fde8e8':([0,6].includes(d.getDay())?'#f7f0df':'#fff');ctx.fillRect(x,yy,cellW,rowH);ctx.strokeStyle='#1f2937';ctx.lineWidth=1.5;ctx.strokeRect(x,yy,cellW,rowH);if(isDuty){ctx.fillStyle='#17365d';ctx.font='bold 16px Arial';ctx.textAlign='center';ctx.fillText('N',x+cellW/2,yy+31);ctx.textAlign='left'}x+=cellW})});
